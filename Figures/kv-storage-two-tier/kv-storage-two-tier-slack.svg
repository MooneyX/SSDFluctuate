<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">两层 KV 存储：推理感知预取与写回</title>
  <desc id="description">SSD 容量层与 GPU HBM 工作层组成两层 KV 存储。推理 CPU 通过推理侧 RNIC、交换网络、存储侧 RNIC 发送 KV 查找与预取请求及排队预测。存储 CPU 查询 DRAM 索引，将命中任务切分，按请求剩余裕量调度下一小块。SSD 经临时 DRAM 缓冲、两端 RNIC 和 GPUDirect RDMA 将 KV 预取至 HBM。写回时，推理侧附带会话、请求、共享性、历史回复间隔和保留策略等元数据。存储 CPU 分别预测复用与淘汰时间，按预期寿命分类并选择 FDP 放置类别或 ZNS 区域。新 KV 从 HBM 经 RNIC、网络和存储侧 DRAM 缓冲写入 SSD。对象写入完成后发布可读索引，经控制通路返回确认，推理侧依据引用状态管理 HBM 回收。</desc>
  <defs>
    <marker id="data-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#326de0" /></marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#7b8fa1" /></marker>
    <marker id="ready-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1 L9 5 L1 9Z" fill="#087f72" /></marker>
